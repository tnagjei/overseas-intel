# 首次导入完整框架与 Git 历史，完成后由正式验证工作流替换。
name: 导入 AIHOT
on:
  push:
    branches: [main]
    paths: [".github/workflows/check.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import:
    if: github.repository == 'tnagjei/overseas-intel'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: 导入固定上游版本与完整历史
        shell: bash
        run: |
          if test -f package.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mapfile -d '' snapshot < <(git ls-tree -rz --name-only "$GITHUB_SHA")
          git remote add upstream https://github.com/KKKKhazix/AIHOT.git
          git fetch upstream
          if ! git merge --no-commit --no-ff --allow-unrelated-histories cf8f8d07d68dfa9079becc72b0717a45b33485f3; then
            test -f .git/MERGE_HEAD
          fi
          git restore --source="$GITHUB_SHA" --staged --worktree -- "${snapshot[@]}"
          test -z "$(git diff --name-only --diff-filter=U)"
          git commit -m "导入 AIHOT 固定版本源码并保留上游历史"
          git push origin HEAD:main
